<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusMind</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Tailwind CSS & Design System Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>

  <!-- Markdown Parser, Sanitizer, Syntax Highlighting & Math Notation -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Minimal Core Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-background text-text-primary font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-accent/30 selection:text-white">

  <!-- Minimal Header: Logo, Title & New Chat -->
  <header class="w-full border-b border-border bg-background/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <img src="assets/campusmind-logo.png" alt="CampusMind Emblem" class="w-7 h-7 object-contain" />
        <span class="font-semibold text-base tracking-tight text-text-primary">CampusMind</span>
      </div>
      <button 
        type="button" 
        id="newChatBtn" 
        onclick="startNewChat()" 
        class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg text-text-secondary hover:text-text-primary hover:bg-surface border border-border transition-colors"
        title="Start a new conversation"
      >
        <span class="material-symbols-outlined text-[16px]">add</span>
        <span>New Chat</span>
      </button>
    </div>
  </header>

  <!-- Centered Chat Container -->
  <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-6 flex flex-col">
    <!-- Messages Thread -->
    <div id="chatMessages" class="flex-1 space-y-6 pb-28">
      
      <!-- Welcome Empty State -->
      <div id="welcomeState" class="py-12 sm:py-20 text-center space-y-4">
        <div class="w-12 h-12 mx-auto rounded-xl bg-surface border border-border flex items-center justify-center text-accent shadow-sm">
          <span class="material-symbols-outlined text-[24px]">school</span>
        </div>
        <div class="space-y-1">
          <h1 class="text-xl font-semibold text-text-primary">CampusMind Assistant</h1>
          <p class="text-sm text-text-secondary max-w-md mx-auto leading-relaxed">
            Ask questions about academic courses, research faculty, lab grants, campus facilities, or degree guidelines.
          </p>
        </div>

        <!-- Clean Prompt Suggestions -->
        <div class="pt-2 flex flex-wrap justify-center gap-2 max-w-lg mx-auto">
          <button type="button" onclick="fillPrompt(this)" class="text-xs px-3 py-1.5 rounded-full bg-surface hover:bg-surface-hover border border-border text-text-secondary hover:text-text-primary transition-colors text-left">
            Prerequisites for CS 4470 Deep Learning?
          </button>
          <button type="button" onclick="fillPrompt(this)" class="text-xs px-3 py-1.5 rounded-full bg-surface hover:bg-surface-hover border border-border text-text-secondary hover:text-text-primary transition-colors text-left">
            Prof. Chen bio-robotics grant summaries
          </button>
          <button type="button" onclick="fillPrompt(this)" class="text-xs px-3 py-1.5 rounded-full bg-surface hover:bg-surface-hover border border-border text-text-secondary hover:text-text-primary transition-colors text-left">
            Open whiteboard rooms in Student Center
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Fixed Bottom Message Composer -->
  <footer class="fixed bottom-0 left-0 right-0 z-20 pointer-events-none pb-4 pt-6 bg-gradient-to-t from-background via-background/95 to-transparent">
    <div class="max-w-3xl mx-auto px-4 pointer-events-auto">
      <div class="relative rounded-2xl bg-surface border border-border shadow-lg p-2 focus-within:border-accent/60 transition-colors">
        <textarea 
          id="messageInput" 
          rows="1" 
          placeholder="Ask anything about campus..." 
          onkeydown="handleComposerKey(event)"
          oninput="autoResizeTextarea(this)"
          class="w-full bg-transparent resize-none border-0 text-text-primary placeholder:text-text-muted text-sm focus:outline-none focus:ring-0 px-2 py-1.5 min-h-[38px] max-h-36"
        ></textarea>
        
        <div class="flex items-center justify-between pt-1 px-2 border-t border-border/50 text-xs text-text-muted">
          <span>Press <kbd class="font-mono text-[11px] bg-background px-1 rounded border border-border text-text-secondary">Enter</kbd> to send, <kbd class="font-mono text-[11px] bg-background px-1 rounded border border-border text-text-secondary">Shift+Enter</kbd> for newline</span>
          
          <button 
            type="button" 
            id="sendBtn" 
            onclick="sendMessage()" 
            class="flex items-center justify-center w-7 h-7 rounded-lg bg-accent text-white hover:bg-accent-hover disabled:opacity-40 disabled:cursor-not-allowed transition-all"
            title="Send Message"
          >
            <span class="material-symbols-outlined text-[16px]">arrow_upward</span>
          </button>
        </div>
      </div>
    </div>
  </footer>

  <!-- Application Script -->
  <script src="js/main.js"></script>
</body>
</html>
